{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block auth_content %}
<section class="login-card">
  <div class="login-logo">D</div>
  <p class="eyebrow">DUYLET BUSINESS SUITE</p>
  <h1>Chào mừng trở lại</h1>
  <p class="muted">Đăng nhập để tiếp tục quản lý hoạt động kinh doanh.</p>
  <form method="post" class="login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Tên đăng nhập<input name="username" autocomplete="username" required autofocus placeholder="Nhập tên đăng nhập"></label>
    <label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required placeholder="Nhập mật khẩu"></label>
    <label class="remember"><input type="checkbox" name="remember"> Ghi nhớ đăng nhập</label>
    <button class="button button-wide" type="submit">Đăng nhập <span>→</span></button>
  </form>
  <div class="login-foot">Mini ERP · Flask + SQLite</div>
</section>
{% endblock %}
