name: Python tests
on:
  push:
    paths:
      - "python-erp-demo/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "python-erp-demo/**"
      - ".github/workflows/python-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-erp-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: pytest -q
